<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/css/style.css">
	<title>商品の決済</title>
</head>

<body>
	<h1>商品の決済</h1>
	<form action="" method="post">
		<table>
			<tr>
				<th>商品ID</th>
				<th>商品名</th>
				<th>単価</th>
				<th>個数</th>
				<th>小計</th>
			</tr>
			<tr th:each="item, iterStat : ${itemList}" th:object="${item}">
				<td>[[ *{id} ]]</td>
				<td><a th:href="@{/item(id=*{id})}">[[ *{name} ]]</a></td>
				<td>[[ *{price} ]]円</td>
				<td>[[ *{unit} ]]個</td>
				<td>[[ *{price * unit} ]]円</td>
			</tr>
			<tr>
				<td>合計</td>
				<td colspan="4">[[ ${total} ]]円</td>
			</tr>
		</table>
		<input type="submit" value="購入する">
	</form>
	<p><a href="/">商品一覧に戻る</a></p>
</body>

</html>
